
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aust Verify</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #06111f;
    color: #eaf8ff;
    font-family: Arial, sans-serif;
    padding: 50px 15px;
}

.container {
    width: 100%;
    max-width: 500px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 35px;
}

h1 {
    font-size: 45px;
    margin: 0;
    font-weight: 900;
    letter-spacing: -2px;
}

.tagline {
    color: #163d68;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-top: 5px;
}

.panel {
    background: #0b1d30;
    border: 1px solid #18364d;
    border-radius: 15px;
    padding: 22px;
    margin-bottom: 18px;
}

h2 {
    font-size: 19px;
    margin: 0 0 18px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin: 17px 0 8px;
}

input, textarea {
    width: 100%;
    padding: 13px;
    background: #061523;
    border: 1px solid #23435c;
    border-radius: 9px;
    color: white;
    outline: none;
    font-size: 14px;
}

input:focus, textarea:focus {
    border-color: #38d9f5;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 17px;
    border: none;
    border-radius: 9px;
    background: #38d9f5;
    color: #061525;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
}

button:hover {
    background: #75eaff;
}

.message {
    font-size: 13px;
    margin-top: 13px;
    color: #38d9f5;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>Aust Verify</h1>
    <div class="tagline">W AUST</div>
</header>

<!-- VERIFICATION CODE -->
<section class="panel">

    <h2>Enter verification code</h2>

    <form id="verifyForm">
        <input
            type="text"
            id="code"
            placeholder="Enter your verification code"
            required
        >

        <button type="submit">Verify</button>
    </form>

    <div class="message" id="verifyMessage"></div>

</section>

<!-- CODE REQUESTS -->
<section class="panel">

    <h2>Code requests</h2>

    <form id="requestForm">

        <label>Your name:</label>
        <input
            type="text"
            id="name"
            placeholder="Your name"
            maxlength="60"
            required
        >

        <label>Your discord username (if any):</label>
        <input
            type="text"
            id="discord"
            placeholder="Discord username (optional)"
            maxlength="80"
        >

        <label>Your Reason/Explaination:</label>
        <textarea
            id="reason"
            placeholder="Explain your reason..."
            maxlength="1000"
            required
        ></textarea>

        <button type="submit">Request a code</button>

    </form>

    <div class="message" id="requestMessage"></div>

</section>

</div>

<script>

// DEMO: Requests are stored locally only.
// They are NOT sent to the website owner.

document.getElementById("requestForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const request = {
        name: document.getElementById("name").value.trim(),
        discord: document.getElementById("discord").value.trim(),
        reason: document.getElementById("reason").value.trim(),
        date: new Date().toISOString()
    };

    let requests = [];

    try {
        requests = JSON.parse(
            localStorage.getItem("austRequests") || "[]"
        );
    } catch (e) {}

    requests.push(request);

    localStorage.setItem(
        "austRequests",
        JSON.stringify(requests)
    );

    document.getElementById("requestMessage").textContent =
        "Request saved locally! Backend submission is not connected yet.";

    this.reset();

});


// DEMO: Verification is not connected to a real code database.

document.getElementById("verifyForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    document.getElementById("verifyMessage").textContent =
        "Verification system is not connected yet.";

});

</script>

</body>
</html>
